[package]
name = "qualia-jepa-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "qualia-jepa-runtime"
path = "src/main.rs"

[features]
default = []
metal = ["qualia-jepa-model/metal"]
cuda = ["qualia-jepa-model/cuda"]
# The fly rate model, observe-only and off unless a build asks for it.
sim = ["dep:qualia-fly-circuit", "qualia-fly-circuit/sim"]

[dependencies]
ctrlc = "3"
qualia-braid = { workspace = true }
qualia-fly-circuit = { workspace = true, optional = true }
qualia-jepa = { workspace = true }
qualia-jepa-model = { workspace = true }
qualia-shm = { workspace = true }
qualia-types = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
candle-core = { version = "=0.9.1", default-features = false }
candle-nn = { version = "=0.9.1", default-features = false }
libc = "0.2"
tempfile = "3"
