[package]
name = "qualia-cuda-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "qualia-cuda-service"
path = "src/main.rs"

[features]
default = ["cuda"]
cuda = ["dep:qualia-cuda", "qualia-cuda/cuda"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qualia-cuda = { workspace = true, optional = true }
