[package]
name = "qualia-abstraction"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "qualia-abstraction"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
qualia-session-store = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
