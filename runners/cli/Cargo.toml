[package]
name = "qualia-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "qualia"
path = "src/main.rs"

[dependencies]
qualia-ipc.workspace = true
qualia-sync-types.workspace = true
qualia-types.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The tests stand up local stubs, one of them TLS-only; the binary itself stays
# an HTTP client that shells out to curl. `rustls` is taken without its default
# `aws-lc-rs` provider so only the ring backend is built.
[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
