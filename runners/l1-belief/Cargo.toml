[package]
name = "qualia-l1-belief"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "qualia-l1-belief"
path = "src/main.rs"

[features]
default = ["metal"]
metal = ["dep:qualia-metal"]
cuda  = ["dep:qualia-cuda", "qualia-cuda/cuda"]

[dependencies]
qualia-types.workspace = true
qualia-shm.workspace = true
qualia-metal = { workspace = true, optional = true }
qualia-cuda  = { workspace = true, optional = true }
