[package]
name = "qualia-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The stack's mission broker and HTTP surface: the operator page, the braid view and the bounded mission-control broker"

[lib]
name = "qualia_agent"
path = "src/lib.rs"

[[bin]]
name = "qualia-agent"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
futures-util = "0.3"
qualia-shm = { workspace = true }
qualia-sync-types = { workspace = true }
qualia-types = { workspace = true }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
