[package]
name = "qualia-braid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "One state machine every strand reports through: evidence seals, memory records, gated promotion, mission brokering, healing ladder"

[dev-dependencies]
tempfile = "3"
[dependencies]
qualia-mcap = { workspace = true }
# The promotion strand's durable side: the braid's PromotionRolledBack fold
# hands the reason to the registry's rollback. The registry has no library
# target yet, so cargo ignores this dependency with a warning and the call is
# deferred: the library lands with C10 (#76) and the routing with T22 (#37).
# See the module docs in src/lib.rs and the resolution comment on issue #34.
qualia-jepa-registry = { workspace = true }
qualia-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
