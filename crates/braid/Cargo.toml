[package]
name = "qualia-braid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "One state machine every strand reports through: evidence seals, memory records, gated promotion, mission brokering, healing ladder"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
[dependencies]
qualia-jepa = { workspace = true }
qualia-mcap = { workspace = true }
# The promotion strand's durable side: the routing (`route` in src/lib.rs) hands
# a PromotionRolledBack's `reason` to the registry's rollback, which records it.
# C10 (#76) gave the registry its library target, so the call the #34 resolution
# deferred is live: T22 (#37) lands the routing.
qualia-jepa-registry = { workspace = true }
qualia-shm = { workspace = true }
qualia-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
