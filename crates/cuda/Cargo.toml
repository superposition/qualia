[package]
name = "qualia-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CUDA compute backend for Jetson Orin Nano (sm_87)"

[features]
cuda = ["dep:cudarc"]

[dependencies]
qualia-types.workspace = true
qualia-shm.workspace = true
# cudarc is optional — activated only when the `cuda` feature is enabled.
# fallback-dynamic-loading: libcuda.so and libnvrtc.so are dlopen()'d at
# runtime on the Jetson; zero CUDA artifacts needed on the macOS build host.
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-12020",
    "fallback-dynamic-loading",
], optional = true }
