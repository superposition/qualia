[package]
name = "qualia-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CUDA compute backend for Jetson Orin Nano (sm_87)"

[features]
cuda = ["dep:cudarc"]

[dependencies]
qualia-types.workspace = true
qualia-shm.workspace = true
# cudarc is behind the `cuda` feature so the default build stays pure Rust.
# It is loaded dynamically: libcuda/libnvrtc are resolved at runtime, so a
# machine without CUDA can still build and test the rest of the workspace.
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-12020",
    "fallback-dynamic-loading",
], optional = true }
