[package]
name = "qualia-jepa-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Candle CNN encoder and predictive world-model candidates for Qualia JEPA"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = { version = "=0.9.1", default-features = false }
candle-nn = { version = "=0.9.1", default-features = false }
qualia-jepa = { workspace = true }
qualia-jepa-dataset = { workspace = true }
serde = { version = "1", features = ["derive"] }
# The candidate manifest and the training report carry f64 gate metrics that
# parity and the planner read back; the default best-effort float parser can
# move a value by one ulp, which would move an emitted value (D-008/D-009).
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
