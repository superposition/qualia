[package]
name = "qualia-jepa-dataset"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Immutable audited MCAP transition manifests for Qualia JEPA training"

[[bin]]
name = "qualia-jepa-dataset"
path = "src/main.rs"

[dependencies]
qualia-jepa = { workspace = true }
qualia-mcap = { workspace = true }
qualia-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
qualia-mcap = { workspace = true }
tempfile = "3"
