[package]
name = "qualia-jepa-dataset"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Immutable audited MCAP transition manifests for Qualia JEPA training"

[[bin]]
name = "qualia-jepa-dataset"
path = "src/main.rs"

[dependencies]
qualia-jepa = { workspace = true }
qualia-mcap = { workspace = true }
qualia-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
# `manifest_digest` re-serializes a parsed manifest, so its floats must survive a
# file round-trip bit for bit; the default best-effort parser rounds some
# 17-digit literals by one ulp and a manifest would then fail its own digest.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
qualia-mcap = { workspace = true }
tempfile = "3"
