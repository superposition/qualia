[package]
name = "qualia-gates"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The repository's gates in Rust: provenance (D-001), figures, journal and mission checks, one binary with subcommands"

[[bin]]
name = "qualia-gates"
path = "src/main.rs"

[dependencies]
# Argument surface is argparse's: subcommand + the same flags, exit 2 on a usage
# error.
clap = { version = "4", features = ["derive"] }
# The table/section parsers are the Python gates' regexes, ported literally.
regex = "1"
# `journal` and `mission` speak HTTP to the site and the agent; `rustls-tls` is
# what lets them read the agent's self-signed certificate (see `runners/watch`).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
# `figures` and `journal` build their fixtures in a scratch directory for
# `--self-test`, as the Python gates did with `tempfile.TemporaryDirectory`.
tempfile = "3"
