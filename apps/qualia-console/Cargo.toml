[package]
name = "qualia-console"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native egui operator console for the braid: mission, belief, world, evidence, telemetry"

[lib]
name = "qualia_console"
path = "src/lib.rs"

[[bin]]
name = "qualia-console"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
] }
egui = "=0.33.3"
qualia-mcap.workspace = true
qualia-shm.workspace = true
qualia-types.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The renderer's platform backends, named on the binary's own dependency graph.
#
# `eframe`'s `wgpu` feature turns on `dep:wgpu` and `dep:egui-wgpu` but no
# backend, and egui-wgpu itself asks wgpu only for `std` and `wgsl`; the one
# crate in the workspace that enables `dx12`/`gles`/`metal` is the
# dev-dependency `egui_kittest`. Dev-dependency features unify for `cargo test`
# but not for `cargo build`, so a tree last built by the suite held a runnable
# `qualia-console.exe` while `cargo run -p qualia-console` - the command
# README.md documents - replaced it with one that panicked before its window
# opened (`wgpu` 27.0.1 `api/instance.rs:65`, "No wgpu backend feature that is
# implemented for the target platform was enabled", exit 101). `vulkan` is here
# for the aarch64 board the ticket exercises on; the set is wgpu's own
# `default` backend list.
wgpu = { version = "=27.0.1", default-features = false, features = [
    "dx12",
    "gles",
    "metal",
    "vulkan",
    "wgsl",
    "std",
] }

[dev-dependencies]
egui_kittest = { version = "=0.33.3", features = ["snapshot", "wgpu"] }
tempfile = "3"
