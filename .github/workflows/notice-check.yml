name: notice-check

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Licence and attribution guard
        run: |
          set -euo pipefail
          test -s NOTICE
          test -s LICENSE
          grep -q "Leash project" NOTICE
          grep -q "CC-BY" NOTICE
          grep -q "Apache License" LICENSE
          echo "NOTICE and LICENSE intact"
