name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the workspace
        run: cargo build --workspace --locked
      - name: Test the workspace
        run: cargo test --workspace --locked

  notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Licence and attribution guard
        run: bash .github/scripts/notice-check.sh

  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The committed mark matches its geometry source
        run: python3 assets/mark/render_mark.py --check
